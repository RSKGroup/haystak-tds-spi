name: ci

on:
  push:
    branches: ["1.5", main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (fmt, vet, lint, test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: go test -race (short, no live backend)
        run: go test -short -race -coverprofile=cover.out ./...

  examples:
    name: build example modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build and vet each example module
        run: |
          for d in examples/*/; do
            if [ -f "$d/go.mod" ]; then
              echo "== $d =="
              ( cd "$d" && go build ./... && go vet ./... && go test -short ./... )
            fi
          done

  integration-es:
    name: integration (live Elasticsearch)
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: wait for elasticsearch
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:9200 >/dev/null && exit 0
            sleep 5
          done
          echo "elasticsearch did not become ready"; exit 1
      - name: conformance + surface against live ES
        working-directory: examples/elasticsearch-community
        env:
          ES_URL: http://localhost:9200
        run: go test -v ./...
