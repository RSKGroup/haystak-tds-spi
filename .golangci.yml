version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (github.com/RSKGroup/haystak-tds-spi/tds.Rows).Close
        - (net.Conn).Close
        - (net.Listener).Close
    staticcheck:
      checks:
        - all
        - -QF1002
        - -QF1012
        - -ST1000
